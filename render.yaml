# Render free web service: Express serves the built app and the /api routes.
# Free instances sleep after ~15 min idle and have no persistent disk, so set
# DATABASE_URL (MySQL, e.g. on cPanel) to keep accounts and synced data. Without it,
# server/data is wiped on restart/redeploy.
services:
  - type: web
    name: nudgy
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        value: muse-spark-1.3
      - key: VOICE_MODEL_NAME
        value: muse-voice-transcribe-1.0
      - key: SAM_MODEL_NAME
        value: sam-3.1
      - key: IMAGE_MODEL_NAME
        value: muse-image-1.0
      # Nudge lines from Muse Spark Open on Baseten; falls back to Muse Spark if it fails.
      - key: NUDGE_ENGINE
        value: open
      - key: OPEN_BASE_URL
        value: https://inference.baseten.co/v1
      - key: OPEN_MODEL
        value: meta-models/muse-spark-open-1026
      - key: OPEN_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
